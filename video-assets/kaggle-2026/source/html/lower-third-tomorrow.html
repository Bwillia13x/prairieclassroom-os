:root { --ivory:#F7F2E8; --navy:#0B2545; --graphite:#2E3238; --gold:#B88A3B; --blueGray:#CBD5E1; --white:#FFFDF8; }
* { box-sizing: border-box; }
html, body { margin: 0; width: 1920px; height: 1080px; overflow: hidden; }
body { background: var(--ivory); font-family: 'Atkinson', system-ui, sans-serif; color: var(--navy); }
.frame { position: relative; width: 1920px; height: 1080px; overflow: hidden; background: var(--ivory); }
.bg { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; filter: saturate(.84) contrast(.94) brightness(1.04); opacity: .76; }
.bg.subtle { opacity: .46; filter: saturate(.70) contrast(.92) brightness(1.08); }
.veil { position: absolute; inset: 0; background: linear-gradient(90deg, rgba(247,242,232,.98) 0%, rgba(247,242,232,.90) 40%, rgba(247,242,232,.34) 72%, rgba(247,242,232,.14) 100%); }

.copy { position: absolute; z-index: 3; }
